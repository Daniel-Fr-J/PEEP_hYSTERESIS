<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ESSENCIAL -->
  <title>Monitor de Histerese Pulmonar</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> <!-- Bootstrap -->
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light text-dark">

  <div class="container my-4">
    <h2 class="text-center mb-4">Monitor de Histerese Pulmonar</h2>

    <div class="row mb-4">
      <div class="col-md-6">
        <label for="ciclos" class="form-label">Ciclos de Histerese:</label>
        <div id="knob-container">
          <div id="knob">
            <div id="indicator"></div>
            <div id="cycle-display">1</div>
          </div>
          <input type="range" class="form-range" id="ciclos" min="0" max="100" value="1" step="1">
        </div>
      </div>

      <div class="col-md-6">
        <label for="peep" class="form-label">PEEP (cmH2O): <span id="peep-value">8.0</span></label>
        <input type="range" class="form-range" id="peep" min="4" max="12" step="0.5" value="8">
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label for="perfil" class="form-label">Perfil do Paciente:</label>
        <select class="form-select" id="perfil">
          <option value="saudavel">Saudável</option>
          <option value="fumante">Fumante</option>
          <option value="asmatico">Asmático</option>
          <option value="dpoc">DPOC</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="col-md-6 d-flex align-items-end">
        <button class="btn btn-primary w-100" onclick="simular()">Simular</button>
      </div>
    </div>

    <div id="grafico" style="height: 400px;"></div>

    <h3 class="mt-5">Simulação com Dados Personalizados</h3>
    <div class="mb-3">
      <label for="dados" class="form-label">Cole seus dados (volume,pressão por linha):</label>
      <textarea id="dados" rows="5" class="form-control" style="font-family: monospace;"></textarea>
      <button class="btn btn-secondary mt-2" onclick="simularPersonalizado()">Usar Dados Personalizados</button>
    </div>

    <div class="mb-3">
      <label for="csvInput" class="form-label">Ou envie um arquivo .csv (volume,pressao):</label>
      <input type="file" class="form-control" id="csvInput" accept=".csv">
    </div>
  </div>

</body>
</html>
